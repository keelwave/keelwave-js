name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        # Both ends of the engines range in package.json.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  publish-npm:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      # Mandatory for npm trusted publishing.
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/keelwave
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish
